general {
    hide_cursor = false
}

background {
    monitor =
    path = screenshot     # blurs whatever's currently on screen — no wallpaper file needed
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(282a36d9)   # colors.primary.background, matches waybar/wofi/mako opacity
    outer_color = rgba(bd93f9ee)   # colors.normal.purple, matches wofi/workspace accent
    fail_color = rgba(ff5555ee)    # colors.normal.red
    font_color = rgb(248, 248, 242) # colors.primary.foreground
    placeholder_text = Input password...
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    color = rgb(255, 121, 198)      # colors.normal.magenta, matches waybar clock
    position = 0, 100
    halign = center
    valign = center
}

